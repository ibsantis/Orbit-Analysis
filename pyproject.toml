[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-analysis"
version = "0.1.0"
description = "Orbit modeling utilities"
readme = "README.md"
requires-python = ">=3.7.3"
license = { file = "LICENSE.md" }
authors = [{ name = "Isaiah Santistevan" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/ibsantis/Orbit-Analysis"

[tool.setuptools.packages.find]
where = ["src"]
